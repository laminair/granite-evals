[project]
name = "sage2-evals"
version = "0.1.0"
description = "Runtime for the Sage2 LLM evaluation suites (Granite 4.2 / Granite 5), packaged for granite.build steps"
readme = "README.md"
authors = [
    { name = "Herbert", email = "herbert@woisetschlaeger.fyi" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# One extra per benchmark family. Upstream harnesses stay external and pinned
# here; each step image installs only the extra it needs, because the harnesses'
# own dependencies conflict with one another.
swebench = [
    "mini-swe-agent==2.4.6",
    "swebench==5.0.2",
]
# NVIDIA NeMo-Skills (github.com/NVIDIA-NeMo/Skills), the harness behind the suite
# metrics named like "pass@1[avg-of-4] symbolic correct" (aime25, gpqa, mmlu-pro,
# arena-hard-v2, ...). No PyPI release: pinned to a commit. Only its prepare / generate /
# evaluate / metrics modules run, locally against the step's vLLM (no Slurm, no NeMo-Run).
nemoskills = [
    "nemo-skills @ git+https://github.com/NVIDIA-NeMo/Skills@bcf059af55c20a89f797724598f9908d126153e6",
    # livecodebench-v6: the evaluator ns's LiveCodeBench eval pip-installs, pinned.
    "livecodebench @ git+https://github.com/wasiahmad/livecodebench@de8b59485a841a43ee2d66fc058f017e42f638db",
    # ruler-*: RULER's data generators (ns's prepare pip-installs them unpinned).
    "wonderwords",
    "nltk",
]
# The inference server. Kept out of the base install so the CLI, tests and the
# result tooling run on a laptop without CUDA.
serve = [
    "vllm==0.27.1",
]

[project.scripts]
sage2-evals = "sage2_evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# NeMo-Skills declares its cluster orchestration (NeMo-Run, nemo-evaluator-launcher)
# as hard dependencies. sage2-evals runs only its local prepare / generate / evaluate
# / metrics modules, which never import them, and NeMo-Run's leptonai pins
# (httpx==0.27.2, prometheus-fastapi-instrumentator==7) cannot co-install with vLLM.
# A marker outside requires-python drops them from the resolution.
override-dependencies = [
    "nemo-run ; python_version < '3'",
    "nemo-evaluator-launcher ; python_version < '3'",
]
