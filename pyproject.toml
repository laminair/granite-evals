[project]
name = "sage2-evals"
version = "0.1.0"
description = "Runtime for the Sage2 LLM evaluation suites (Granite 4.2 / Granite 5), packaged for granite.build steps"
readme = "README.md"
authors = [
    { name = "Herbert", email = "herbert@woisetschlaeger.fyi" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# One extra per benchmark family. Upstream harnesses stay external and pinned
# here; each step image installs only the extra it needs, because the harnesses'
# own dependencies conflict with one another.
swebench = [
    "mini-swe-agent==2.4.6",
    "swebench==5.0.2",
]
# BFCL v4 (gorilla). Its benchmark data ships inside the package, so this pin
# is also the dataset pin. soundfile: imported by bfcl_eval, undeclared.
bfcl = [
    "bfcl-eval==2026.3.23",
    "soundfile==0.13.1",
]
# BIRD text-to-SQL (birdbench): NeMo-Skills' birdbench, the harness behind the
# Granite 4.2 model card's BirdBench number (its prompt, schema dump and SQL
# extraction). Same commit as the nemoskills extra.
bird = [
    "nemo-skills @ git+https://github.com/NVIDIA-NeMo/Skills@bcf059af55c20a89f797724598f9908d126153e6",
]
# The inference server. Kept out of the base install so the CLI, tests and the
# result tooling run on a laptop without CUDA.
serve = [
    "vllm==0.27.1",
]

[project.scripts]
sage2-evals = "sage2_evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# bfcl-eval pins numpy==1.26.4 (a blanket "pin what is installed" upstream, not a
# numpy-2 incompatibility; granite.build's bfcl-eval step runs it on numpy 2), while
# vllm==0.27.1, in every image, needs numpy>=2. Every image resolves numpy 2 anyway.
override-dependencies = [
    "numpy>=2",
    # NeMo-Skills (bird) declares its cluster orchestration as hard dependencies;
    # sage2-evals never imports them and they can't co-install with vLLM (same as
    # the nemoskills extra). A marker outside requires-python drops them.
    "nemo-run ; python_version < '3'",
    "nemo-evaluator-launcher ; python_version < '3'",
]
# bfcl-eval also pins filelock==3.20.0 and more; resolve it apart so it doesn't
# downgrade other families' images.
conflicts = [
    [{ extra = "bfcl" }, { extra = "swebench" }],
    # tree-sitter: bfcl-eval pins 0.21.3, NeMo-Skills' compute-eval needs >=0.25.2.
    [{ extra = "bfcl" }, { extra = "bird" }],
    # NeMo-Skills pins litellm==1.84.10 and mcp<2; keep swebench's resolution apart.
    [{ extra = "bird" }, { extra = "swebench" }],
]
